name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: compile
        run: cl /nologo /std:c++17 /EHsc /O2 /W3 /D_CRT_SECURE_NO_WARNINGS robrun_cheat.cpp /Fe:robrun_cheat.exe user32.lib gdi32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: robrun_cheat
          path: robrun_cheat.exe
